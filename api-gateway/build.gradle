plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':shared-lib')
    
    // Spring Boot Web & Security (con versiones explícitas)
    implementation 'org.springframework.boot:spring-boot-starter-web:4.0.8-SNAPSHOT'
    implementation 'org.springframework.boot:spring-boot-starter-security:4.0.8-SNAPSHOT'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:4.0.8-SNAPSHOT'
    implementation 'org.springframework.boot:spring-boot-starter-validation:4.0.8-SNAPSHOT'
    
    // Database
    runtimeOnly 'com.mysql:mysql-connector-j:8.3.0'

    // OpenAPI / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    // Jackson para LocalDateTime
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.0'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test:4.0.8-SNAPSHOT'
    testImplementation 'org.springframework.security:spring-security-test:6.2.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootRun') {
    doFirst {
        def envFile = rootProject.file('.env')
        if (envFile.exists()) {
            envFile.readLines().each { line ->
                line = line.trim()
                if (line && !line.startsWith('#') && line.contains('=')) {
                    def idx = line.indexOf('=')
                    environment line.substring(0, idx).trim(), line.substring(idx + 1).trim()
                }
            }
        }
    }
}